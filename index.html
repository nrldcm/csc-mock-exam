<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="icon.svg" type="image/svg+xml">

<!-- Link previews (Facebook, Messenger, LinkedIn, X) -->
<meta property="og:type" content="website">
<meta property="og:title" content="CSC Mock Exam and Reviewer">
<meta property="og:description" content="Free Civil Service Exam reviewer for phones and tablets: timed mock exams, 400 items with explanations, unlimited practice and study notes. Works offline.">

<meta name="twitter:card" content="summary_large_image">

<style>
  /* Splash loader: shown until the app paints */
  #splash{position:fixed;inset:0;z-index:999;display:grid;place-items:center;background:#1F3A68;color:#fff;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:opacity .3s}
  #splash.out{opacity:0;pointer-events:none}
  #splash .box{display:grid;justify-items:center;gap:14px;text-align:center}
  #splash .ring{width:72px;height:72px;border-radius:50%;border:4px solid rgba(184,144,28,.3);border-top-color:#B8901C;animation:sp 0.9s linear infinite}
  #splash .t{font-family:Georgia,serif;font-weight:700;font-size:1.25rem}
  #splash .s{font-size:.85rem;opacity:.75}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){#splash .ring{animation-duration:3s}}
</style>
</head>
<body>
<div id="splash" role="progressbar" aria-label="Loading CSC Mock Exam">
  <div class="box"><div class="ring"></div><div class="t">CSC Mock Exam</div><div class="s">Loading your reviewer…</div></div>
</div>
<div id="root"></div>
<noscript><p style="padding:16px">This app needs JavaScript to run.</p></noscript>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
